[package]
name = "tor-socks-gui"
version = "0.2.0"
description = "OnionGate — Tor Workstation Toolkit with isolated routing and Onion Lab"
authors = ["adamsiwiec"]
edition = "2021"
default-run = "tor-socks-gui"

[lib]
name = "tor_socks_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tor-socks-cli"
path = "src/bin/tor_socks_cli.rs"

# Privileged helper daemon (macOS). Installed once via SMAppService; performs a
# fixed set of root operations so the app does not re-prompt for admin.
[[bin]]
name = "oniongate-helper"
path = "src/bin/oniongate_helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt-multi-thread", "macros", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
dirs = "6"
thiserror = "2"
which = "7"
hex = "0.4"
tauri-plugin-dialog = "2.7.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
data-encoding = "2.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
sha2 = "0.11.0"

# Windows-only: run the privileged helper as a Windows service (SCM).
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
